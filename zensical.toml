# Сайт документации (Zensical). Часть страниц генерируется — сначала
# `python tools/build_site.py`, потом `zensical serve` / `zensical build`.
# Сгенерированное (docs/gallery/, docs/reference/, docs/assets/,
# docs/questions.md) в гит не коммитится.

[project]
site_name = "Учебные материалы по физике"
site_description = "Claude-скилл для учителей: рабочие листы, конспекты и SVG-иллюстрации по физике"
# Ссылка на репозиторий в шапке сайта: одно место на весь сайт, вместо
# URL, разбросанных по страницам.
repo_url = "https://github.com/dauletra/physics-skill"
repo_name = "dauletra/physics-skill"

nav = [
  { "Обзор" = "index.md" },
  { "Установка" = "install.md" },
  { "Виды заданий" = "questions.md" },
  { "Слайды презентации" = "slides.md" },
  # График — самая частая иллюстрация, поэтому его страница вынесена из
  # галереи наверх: это не карточка типа, а разбор случаев.
  { "Графики" = "gallery/graph.md" },
  { "Галерея иллюстраций" = [
    { "Приборы со шкалой" = "gallery/instrument.md" },
    { "Бумага" = "gallery/paper.md" },
    { "Векторные диаграммы" = "gallery/vectors.md" },
  ] },
  { "Разработчикам" = [
    { "С чего начать" = "contribute.md" },
    { "Архитектура" = "architecture.md" },
    { "Принципы схемы" = "schema-design-principles.md" },
    { "Выгрузка в Word" = "word-export.md" },
    { "Презентация к уроку" = "presentation.md" },
    { "Справочник: документ" = "reference/document.md" },
    { "Справочник: виды заданий" = "reference/questions.md" },
    { "Справочник: виды слайдов" = "reference/slides.md" },
    { "Справочник: иллюстрации" = "reference/visuals.md" },
    { "Справочник: символы" = "reference/symbols.md" },
  ] },
]

[project.theme]
language = "ru"
features = [
  "content.code.copy",
  "navigation.sections",
  "navigation.top",
  "search.highlight",
  "toc.follow",
]

[[project.theme.palette]]
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Тёмная тема"

[[project.theme.palette]]
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Светлая тема"

# Нужны страницам галереи и справочников: врезки (`!!!`), свёрнутые спеки
# (`???`), таблицы, подсветка JSON, кнопки на главной.
[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.def_list]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions.tables]
[project.markdown_extensions.toc]
permalink = true
[project.markdown_extensions.pymdownx.details]
[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
[project.markdown_extensions.pymdownx.inlinehilite]
[project.markdown_extensions.pymdownx.superfences]
