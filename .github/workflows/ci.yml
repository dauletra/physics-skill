name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package with dev extras
        run: pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check .
      - name: Type-check (mypy)
        run: mypy
      - name: Tests
        run: python -m pytest tests -q
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: uv.lock is in sync with pyproject (user-facing run contract)
        run: uv lock --check
      - name: Machine-readable schema is in sync with models
        run: |
          python -m worksheet_builder --emit-schema /tmp/schema.json
          python - <<'EOF'
          import json, sys
          committed = json.load(open("docs/task.schema.json", encoding="utf-8"))
          generated = json.load(open("/tmp/schema.json", encoding="utf-8"))
          if committed != generated:
              sys.exit("docs/task.schema.json is stale - regenerate with "
                       "`python -m worksheet_builder --emit-schema docs/task.schema.json`")
          EOF
