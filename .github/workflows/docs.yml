# Публикация сайта документации на GitHub Pages.
#
# Ничего не делает, пока в настройках репозитория не включён Pages
# (Settings -> Pages -> Source: GitHub Actions). Сборку сайта на каждый push
# проверяет job `docs` в ci.yml — этот workflow только выкладывает.
name: Docs

on:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Параллельные деплои не нужны: публикуется последнее состояние ветки.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package with docs extras
        run: pip install -e ".[docs]"
      - name: Generate gallery and reference mirrors
        run: python build_docs.py
      - name: Build site
        run: zensical build --clean --strict
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/deploy-pages@v4
        id: deployment
