<!doctype html>
<!--
  Плеер презентации. Рендерит слайды из JSON-блоба ниже — и только из него:
  содержательной разметки в этом файле нет и быть не должно, сборка делает
  ровно одну замену — вставляет блоб в блок presentation-data. Тот же плеер
  позже уедет на сервер; данные этого не заметят — см. docs/presentation.md.
-->
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Презентация</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<style>
  /* Система оформления — docs/slide-design.md. Всё, чем плеер рисует, живёт
     здесь: размеров и цветов вне этого блока быть не должно, потому что вид
     слайда собирается из готовых величин, а не изобретает свои. Схема про
     них не знает и знать не будет (docs/presentation.md §13). */
  :root {
    /* Стек честный: PT Sans не входит ни в Windows, ни в macOS, и раньше
       первая строка стека не применялась никогда. Разницу в метриках
       системных шрифтов гасит запас по месту, а не подгонка кегля. */
    --font: system-ui, "Segoe UI", "SF Pro Text", "Noto Sans", "DejaVu Sans", sans-serif;

    /* Бумага не чисто белая: снятые проценты яркости заметно убирают блик
       светодиодной доски в освещённом кабинете, а контраст текста остаётся
       16,9:1. Поле вокруг кадра темнее бумаги — иначе лист не читается
       листом. Тёмная заливка не чёрная: между двумя светлыми слайдами
       чёрный кадр бьёт по зрачку и проявляет неровность подсветки. */
    --paper: #F7F9FB;
    --paper-sunk: #EDF1F6;
    --around: #DFE5EC;
    /* Поле вокруг проекции во весь экран — единственное место, где чёрный
       уместен: его задача исчезнуть на стене, а не быть поверхностью. */
    --letterbox: #000000;
    --line: #D3DAE3;
    --ink: #15181D;
    --ink-soft: #4A5261;
    --ink-faint: #69727E;
    --panel: #1C2733;

    /* Один хроматический тон на всю систему: он несёт смысл (структура и
       управление) и никогда не украшает. Синий — единственный тон, надёжно
       различимый при дейтеранопии и протанопии, а в классе физики таких
       учеников статистически один-два. Иллюстрации остаются ч/б: акцент
       живёт в оформлении слайда и внутрь SVG не заходит. */
    --accent: #1B5FA8;
    --accent-soft: #E4EDF7;
    --accent-line: #B9CEE6;

    /* Пульт принадлежит кадру, а не слайду, и обязан читаться на любой его
       заливке. Своя тройка токенов нужна ровно поэтому: под тёмным слайдом
       она переключается, а всё остальное оформление — нет. */
    --chrome: var(--paper-sunk);
    --chrome-ink: var(--ink-faint);
    --chrome-line: var(--line);

    /* Шкала в cqh — процентах высоты кадра, а не окна. Шаг 1,25, опора
       --t-m: с последней парты кабинета 1cqh ≈ 4,6 угловой минуты, а
       комфортное чтение по ISO 9241-303 начинается с 20. Отсюда 4,5cqh
       (те же 24 pt, что требуют от PowerPoint). Ниже --t-s текста, который
       читает класс, на слайде нет: --t-xs — только служебное, его читает
       учитель с метра. */
    --t-hero: 11cqh;
    --t-xxl: 8.8cqh;
    --t-xl: 7cqh;
    --t-l: 5.6cqh;
    --t-m: 4.5cqh;
    --t-s: 3.6cqh;
    --t-xs: 2.9cqh;
    --lead: 1.45;

    /* Пол иллюстрации. Ниже него картинка не ужимается ни при каком объёме
       текста: подписи внутри SVG живут в единицах viewBox и мельчают вместе
       с ней, поэтому «осталось место — и ладно» кончается графиком, который
       с задней парты не прочитать. */
    --visual-min: 38cqh;
  }

  /* Одна ступень вниз — и всё. Не плавная подгонка: плавная делает кегль
     разным на каждом слайде урока, и класс перестаёт понимать, что важно, а
     что просто длинно. Шкала сдвигается целиком, чтобы иерархия заголовка и
     текста не схлопнулась; значения — те же семь ступеней из :root. */
  .slide[data-dense] {
    --t-xl: 5.6cqh;
    --t-l: 4.5cqh;
    --t-m: 3.6cqh;
    --lead: 1.3;
  }

  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    font-family: var(--font);
    color: var(--ink);
    background: var(--around);
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* Кадр 16:9 — то же поле, что у проектора. Слайд живёт внутри него и
     никогда не растекается по окну: размер кадра берёт то из двух
     ограничений, которое наступает раньше, а пропорции держит aspect-ratio.
     Всё внутри задано в cqh — процентах высоты кадра, — поэтому слайд не
     пересчитывает себя под окно, а масштабируется целиком и одинаково. */
  #stage {
    --pad: 2.5vmin;
    position: relative;
    width: min(calc(100vw - 2 * var(--pad)), calc((100vh - 2 * var(--pad)) * 16 / 9));
    aspect-ratio: 16 / 9;
    container-type: size;
    overflow: hidden;
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 1vmin;
    box-shadow: 0 0.4vmin 2.4vmin rgba(20, 30, 50, 0.18);
  }

  /* Во весь экран кадр остаётся тем же кадром: уходят поля и рамка, а поле
     вокруг проекции чернеет — так его и не видно на стене. */
  :fullscreen, :fullscreen body { background: var(--letterbox); }
  :fullscreen #stage {
    --pad: 0px;
    border: none;
    border-radius: 0;
    box-shadow: none;
  }

  .slide {
    position: absolute;
    inset: 0;
    display: none;
    flex-direction: column;
    justify-content: center;
    padding: 6cqh 8cqh;
    gap: 3cqh;
    /* Кадр — граница: слайд, которому не хватило места, обрезается, а не
       раздвигает рамку и не мельчает сам. */
    overflow: hidden;
  }
  .slide.active { display: flex; }

  .slide-title { align-items: center; text-align: center; }
  .slide-title h1 { font-size: var(--t-hero); font-weight: 700; }
  .slide-title .subtitle { font-size: var(--t-l); color: var(--ink-soft); }

  /* Заголовку важнее не оставить одно слово на второй строке, чем занять
     всю ширину: на доске висящий хвост читается как ошибка вёрстки. */
  .slide h2 { font-size: var(--t-xl); font-weight: 700; text-wrap: balance; }
  .slide p { font-size: var(--t-m); line-height: var(--lead); text-wrap: pretty; }
  .slide ul, .slide ol {
    font-size: var(--t-m);
    line-height: var(--lead);
    padding-left: 1.2em;
    text-wrap: pretty;
  }
  .slide li { margin: 0.4em 0; }

  .slide-board_task p.condition, .slide-example p.condition { font-size: var(--t-l); }

  /* Разделитель этапа — единственный слайд, который выглядит иначе: он не
     содержание, а знак препинания между частями урока. */
  .slide-section { background: var(--panel); color: var(--paper); align-items: center; }
  .slide-section h2 { font-size: var(--t-xxl); text-align: center; }

  /* Формула — предмет слайда, а не строка внутри абзаца. Отсюда и размер, и
     display-вид: в тексте KaTeX набирает дробь по высоте строки, и с задней
     парты она перестаёт читаться. Разбор обозначений идёт парами в две
     колонки — «символ | что это» находится глазами, абзац с той же
     расшифровкой не находится. */
  .slide-formula { align-items: center; text-align: center; }
  .slide-formula .formula { font-size: var(--t-xxl); }
  .slide-formula .terms {
    display: grid;
    grid-template-columns: auto auto;
    column-gap: 1.2em;
    row-gap: 0.3em;
    font-size: var(--t-s);
    text-align: left;
  }
  .slide-formula .terms dt { font-weight: 700; text-align: right; }
  .slide-formula .terms dd { color: var(--ink-soft); }

  /* Сопоставление и набор задач раскладываются одинаково — сеткой равных
     ячеек, — потому что в данных они об одном: несколько равноправных
     кусков на экране. Сколько их, слайд говорит, а во что они встают,
     решает плеер (docs/slide-templates.md §5). */
  .slide-compare .cases, .slide-tasks .grid {
    display: grid;
    flex: 1;
    min-height: 0;
    gap: 2cqh 5cqh;
  }
  .slide-compare .case, .slide-tasks .task {
    display: flex;
    flex-direction: column;
    gap: 1.5cqh;
    min-height: 0;
  }
  /* Своего кегля у ячейки нет: текст в колонке читают с той же парты, что
     текст во всю ширину, и мельче он быть не может. Ячейка платит за это
     вместимостью — три случая по пять строк на слайд не помещаются, и это
     ограничение жанра, а не вёрстки. */
  .slide-compare .case h3 { font-size: var(--t-l); }
  .slide-compare .case ul { padding-left: 1em; }

  /* Номер задачи рисует плеер: в данных его нет, потому что номер — это
     место в списке, а не свойство задачи (принцип 2). */
  .slide-tasks .grid { counter-reset: task; }
  /* Номер — то, что учитель произносит вслух («решаем вторую»), поэтому он
     набран акцентом, а не самым бледным серым на слайде. */
  .slide-tasks .task > p:first-child::before {
    counter-increment: task;
    content: counter(task) ". ";
    font-weight: 700;
    color: var(--accent);
  }
  /* Плашки ответов встают в одну линию по низу ячеек, а не там, куда их
     опустил текст: задача с картинкой длиннее задачи без неё, и плашки на
     разной высоте читаются как сбитая вёрстка, а не как ряд ответов. */
  .slide-tasks .answer { margin-top: auto; }

  /* Шаг разбора и ответ ждут своей очереди. Место под них занято сразу:
     слайд не должен прыгать в тот момент, когда класс на него смотрит. */
  .fragment { opacity: 0; transition: opacity 0.15s ease-out; }
  .fragment.shown { opacity: 1; }

  /* Ответ — спойлер: плашка накрывает готовый текст, щелчок по ней его
     показывает, следующий щелчок прячет обратно. Стрелки сюда не ходят —
     ответ не `.fragment`, и открыть его можно только намеренно. */
  .answer {
    /* Текст ответа и плашка лежат в одной ячейке грида, поэтому коробка
       получает ширину большего из двух: плашка ровно по ответу, а не во всю
       строку, и слайд не прыгает, когда ответ открыли. */
    display: inline-grid;
    align-self: flex-start;
    max-width: 100%;
    /* Поле плашки уходит наружу: открытый ответ стоит в одну линию с
       остальным текстом слайда, а не с отступом. */
    margin-left: -0.5em;
    font: inherit;
    font-size: var(--t-m);
    font-weight: 700;
    text-align: left;
    color: inherit;
    background: none;
    border: none;
    padding: 0;
    cursor: pointer;
  }
  .answer .body, .answer .cover { grid-area: 1 / 1; padding: 0.15em 0.5em; }
  .answer .label { font-weight: 400; color: var(--ink-faint); }
  /* Спрятан от глаз, но не из потока: место под ответ занимает сам ответ. */
  .answer .body { visibility: hidden; }
  .answer.open .body { visibility: visible; }
  /* Плашка — единственное, по чему учитель обязан попасть пальцем под голос
     класса, поэтому она набрана акцентом: видно, что это орган управления, а
     не выцветший кусок текста. */
  .answer .cover {
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 400;
    color: var(--accent);
    background: var(--accent-soft);
    border: 1px dashed var(--accent-line);
    border-radius: 0.35em;
    transition: opacity 0.15s ease-out;
  }
  .answer.open .cover { opacity: 0; visibility: hidden; }
  /* Наведение только подсвечивает: показывает ответ щелчок, а не мышь,
     проехавшая мимо. */
  .answer:hover .cover { border-color: var(--accent); }
  .answer:focus-visible { outline: none; }
  .answer:focus-visible .cover { border-style: solid; border-color: var(--accent); }

  /* Картинка на слайде — не иллюстрация внутри текста, а сам предмет
     разговора: она забирает всё свободное место, а не остаётся того
     размера, в котором её печатают на листе. */
  figure {
    display: flex;
    flex: 1;
    justify-content: center;
    align-items: center;
    min-height: 0;
  }
  /* Пол — только у картинки самого слайда. В ячейке compare или tasks она
     занимает половину ширины, и такой же пол по высоте выдавил бы ячейку
     из кадра; там места ей отмеряет сама ячейка. */
  .slide > figure { min-height: var(--visual-min); }
  /* Вписывает рисунок сам viewBox (xMidYMid meet) — svg остаётся коробкой
     во всё отведённое место, пропорции держит холст, а не CSS. */
  figure svg { width: 100%; height: 100%; }

  /* Две колонки — способ дать картинке её пол, когда в столбик текст и
     картинка вместе уже не влезают. Колонка текста уже, поэтому строк в неё
     помещается больше на ту же высоту, и слайд перестаёт быть выбором между
     условием и графиком. Кто во что встаёт, решает fit() — по замеру. */
  /* Текстовая колонка шире картинки, хотя предмет разговора — картинка.
     Замер: при равных колонках и при узкой текстовой этот же слайд не
     влезает и уходит на ступень вниз, а картинка, выигравшая проценты
     ширины, не стоит текста, упавшего ниже порога читаемости. */
  .slide.split.active {
    display: grid;
    grid-template-columns: 1.2fr 1fr;
    column-gap: 5cqh;
    align-items: center;
  }
  .slide.split > figure { align-self: stretch; }
  .prose {
    display: flex;
    flex-direction: column;
    gap: 3cqh;
    min-width: 0;
    min-height: 0;
  }

  .placeholder { color: var(--ink-soft); font-size: var(--t-m); align-items: center; }

  .blank {
    text-decoration: underline;
    text-underline-offset: 0.2em;
    white-space: pre;
  }

  /* Пульт живёт внутри кадра — вместе с ним уезжает в полный экран и вместе
     с ним масштабируется, а не висит в углу окна сам по себе. */
  #hud {
    position: absolute;
    z-index: 2;
    right: 2cqh;
    bottom: 2cqh;
    display: flex;
    align-items: center;
    gap: 1.2cqh;
    font-size: var(--t-xs);
    color: var(--chrome-ink);
    user-select: none;
  }
  #hud button {
    font: inherit;
    color: inherit;
    background: var(--chrome);
    border: 1px solid var(--chrome-line);
    border-radius: 0.5em;
    padding: 0.1em 0.7em;
    cursor: pointer;
  }
  #hud button:hover { color: var(--ink); border-color: var(--ink-faint); }

  /* Тёмный слайд — тёмный пульт. Иначе кнопки становятся самым светлым
     пятном кадра и класс смотрит на них, а не на название этапа. */
  #stage:has(.slide-section.active) {
    --chrome: #2A3746;
    --chrome-ink: #9AA6B4;
    --chrome-line: #3D4C5E;
  }
  #stage:has(.slide-section.active) #hud button:hover { color: var(--paper); }
  #stage-label { max-width: 30cqh; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* Список этапов: учителю нужно уметь вернуться к разбору, а не пролистать
     до него. Этапы — слайды section, навигацию по ним строит плеер. */
  #stages {
    position: absolute;
    z-index: 3;
    inset: 0;
    background: var(--paper);
    display: none;
    flex-direction: column;
    justify-content: center;
    gap: 0.5cqh;
    padding: 6cqh 8cqh;
    overflow-y: auto;
  }
  #stages.open { display: flex; }
  #stages .caption { font-size: var(--t-xs); color: var(--ink-faint); margin-bottom: 1.5cqh; }
  #stages button {
    font: inherit;
    font-size: var(--t-l);
    text-align: left;
    color: var(--ink);
    background: none;
    border: none;
    padding: 0.25em 0;
    cursor: pointer;
  }
  #stages button:hover { text-decoration: underline; }
  #stages button.here::after { content: " ←"; color: var(--accent); }
</style>
</head>
<body>
<script type="application/json" id="presentation-data">__PRESENTATION_DATA__</script>
<main id="stage">
  <div id="stages"></div>
  <footer id="hud">
    <span id="stage-label"></span>
    <button id="full" type="button" aria-label="Во весь экран" title="Во весь экран (F)">&#10530;</button>
    <button id="prev" type="button" aria-label="Предыдущий слайд">&#8249;</button>
    <span id="counter"></span>
    <button id="next" type="button" aria-label="Следующий слайд">&#8250;</button>
  </footer>
</main>
<script>
"use strict";

/* Runs -> DOM. The wire form is declared in physics_svg/inline.py; the
   player maps it and never parses author text itself. */
function runsInto(target, runs) {
  (runs || []).forEach(function (run) {
    if (run.math !== undefined) {
      var span = document.createElement("span");
      if (window.katex) {
        /* \displaystyle и внутри строки: в тексте KaTeX набирает числитель
           дробью от кегля абзаца, и на слайде это уходит за порог
           читаемости вдвое. Плотную абзацную типографику, ради которой
           инлайн и мельчает, на слайде защищать не от чего, а последняя
           парта есть. */
        katex.render("\\displaystyle " + run.math, span, {
          throwOnError: false,
          displayMode: !!run.display
        });
      } else {
        /* Без сети формула остаётся исходным текстом — та же защита, что в документе. */
        span.textContent = (run.display ? "$$" : "$") + run.math + (run.display ? "$$" : "$");
      }
      target.appendChild(span);
    } else if (run.blank !== undefined) {
      var blank = document.createElement("span");
      blank.className = "blank";
      blank.textContent = " ".repeat(run.blank);
      target.appendChild(blank);
    } else if (run.script) {
      var script = document.createElement(run.script);
      script.textContent = run.t;
      target.appendChild(script);
    } else {
      target.appendChild(document.createTextNode(run.t));
    }
  });
}

function el(tag, className, runs) {
  var node = document.createElement(tag);
  if (className) node.className = className;
  if (runs) runsInto(node, runs);
  return node;
}

function figureFor(visual) {
  var figure = document.createElement("figure");
  figure.innerHTML = visual.svg; /* generated by our renderer, escaped at the source */
  return figure;
}

function itemsList(items) {
  var list = document.createElement("ul");
  (items || []).forEach(function (item) {
    var li = document.createElement("li");
    runsInto(li, item);
    list.appendChild(li);
  });
  return list;
}

/* Ответ приходит в данных всегда, а показывается спойлером: когда его
   открыть — решение плеера, а не поле слайда (docs/presentation.md §3).

   Спойлер, а не шаг навигации: шаг разбора учитель проходит вместе с
   классом, а ответ показывает намеренно — и промахнуться стрелкой мимо
   этого решения нельзя. Поэтому ответ не `.fragment`: стрелки и пробел его
   не открывают, счётчик его не обещает, открывает только щелчок по плашке.

   Текст ответа стоит на месте всегда и лишь спрятан от глаз, плашка лежит
   в той же ячейке грида — так место занято настоящим ответом, плашка не
   шире его, и слайд не прыгает ни когда ответ открыли, ни когда закрыли
   обратно. Подсказку «нажмите» несёт подпись кнопки, а не сама плашка:
   лишнее слово на ней задало бы ширину вместо ответа. */
function answerBlock(answer) {
  var node = document.createElement("button");
  node.type = "button";
  node.className = "answer spoiler";
  node.setAttribute("aria-expanded", "false");

  var body = el("span", "body");
  var label = document.createElement("span");
  label.className = "label";
  label.textContent = "Ответ: ";
  body.appendChild(label);
  runsInto(body, answer);
  node.appendChild(body);

  var cover = document.createElement("span");
  cover.className = "cover";
  cover.textContent = "Ответ";
  node.appendChild(cover);

  node.setAttribute("aria-label", "Показать ответ");
  node.title = "Нажмите, чтобы показать ответ";
  node.addEventListener("click", function () {
    var open = node.classList.toggle("open");
    node.setAttribute("aria-expanded", open ? "true" : "false");
    node.setAttribute("aria-label", open ? "Скрыть ответ" : "Показать ответ");
    node.title = open ? "Нажмите, чтобы скрыть ответ" : "Нажмите, чтобы показать ответ";
    /* Кнопка, нажатая мышью, остаётся в фокусе — и следующий пробел ушёл бы
       ей, а не показу. */
    node.blur();
  });
  return node;
}

var RENDERERS = {
  title: function (slide, root) {
    root.appendChild(el("h1", "", slide.text));
    if (slide.subtitle) root.appendChild(el("div", "subtitle", slide.subtitle));
  },
  objectives: function (slide, root) {
    root.appendChild(el("h2", "", [{ t: "Цели урока" }]));
    root.appendChild(itemsList(slide.items));
  },
  section: function (slide, root) {
    root.appendChild(el("h2", "", slide.text));
  },
  content: function (slide, root) {
    if (slide.heading) root.appendChild(el("h2", "", slide.heading));
    if (slide.text) root.appendChild(el("p", "", slide.text));
    if (slide.items) root.appendChild(itemsList(slide.items));
    if (slide.visual) root.appendChild(figureFor(slide.visual));
  },
  example: function (slide, root) {
    root.appendChild(el("p", "condition", slide.text));
    if (slide.visual) root.appendChild(figureFor(slide.visual));
    var steps = document.createElement("ol");
    (slide.steps || []).forEach(function (step) {
      var item = el("li", "fragment", step);
      steps.appendChild(item);
    });
    root.appendChild(steps);
    if (slide.answer) root.appendChild(answerBlock(slide.answer));
  },
  board_task: function (slide, root) {
    root.appendChild(el("p", "condition", slide.text));
    if (slide.visual) root.appendChild(figureFor(slide.visual));
    if (slide.answer) root.appendChild(answerBlock(slide.answer));
  },
  formula: function (slide, root) {
    if (slide.heading) root.appendChild(el("h2", "", slide.heading));
    root.appendChild(el("div", "formula", slide.formula));
    if (slide.text) root.appendChild(el("p", "", slide.text));
    if (slide.terms) {
      var terms = document.createElement("dl");
      terms.className = "terms";
      slide.terms.forEach(function (term) {
        terms.appendChild(el("dt", "", term.symbol));
        terms.appendChild(el("dd", "", term.meaning));
      });
      root.appendChild(terms);
    }
  },
  compare: function (slide, root) {
    if (slide.heading) root.appendChild(el("h2", "", slide.heading));
    var cases = document.createElement("div");
    cases.className = "cases";
    /* Колонок ровно столько, сколько случаев: они равноправны, и делить
       кадр между ними поровну — это и есть «рядом». */
    cases.style.gridTemplateColumns = "repeat(" + (slide.cases || []).length + ", 1fr)";
    (slide.cases || []).forEach(function (item) {
      var box = document.createElement("div");
      box.className = "case";
      box.appendChild(el("h3", "", item.label));
      if (item.text) box.appendChild(el("p", "", item.text));
      if (item.items) box.appendChild(itemsList(item.items));
      if (item.visual) box.appendChild(figureFor(item.visual));
      cases.appendChild(box);
    });
    root.appendChild(cases);
  },
  tasks: function (slide, root) {
    if (slide.heading) root.appendChild(el("h2", "", slide.heading));
    var grid = document.createElement("div");
    grid.className = "grid";
    var list = slide.tasks || [];
    /* Две задачи встают рядом, три-четыре — в две колонки и два ряда:
       колонка уже половины кадра с задней парты не читается. */
    grid.style.gridTemplateColumns = "repeat(" + Math.min(list.length, 2) + ", 1fr)";
    list.forEach(function (task) {
      var box = document.createElement("div");
      box.className = "task";
      box.appendChild(el("p", "", task.text));
      if (task.visual) box.appendChild(figureFor(task.visual));
      /* Ответ у каждой задачи свой: класс решает их параллельно, и учитель
         открывает тот, до которого дошли. */
      if (task.answer) box.appendChild(answerBlock(task.answer));
      grid.appendChild(box);
    });
    root.appendChild(grid);
  },
  prompt: function (slide, root) {
    root.appendChild(el("h2", "", [{ t: "Вопросы классу" }]));
    root.appendChild(itemsList(slide.items));
  },
  reflection: function (slide, root) {
    root.appendChild(el("h2", "", [{ t: "Рефлексия" }]));
    root.appendChild(itemsList(slide.items));
  }
};

function buildSlide(slide) {
  var root = document.createElement("section");
  var render = RENDERERS[slide.type];
  if (render) {
    root.className = "slide slide-" + slide.type;
    render(slide, root);
  } else {
    /* Старый плеер обязан пережить новый тип слайда — заглушкой, не падением. */
    root.className = "slide placeholder";
    root.appendChild(el("p", "", [{ t: "Слайд типа «" + slide.type + "» этот плеер ещё не умеет" }]));
  }
  return root;
}

/* Насколько содержимое вылезло за поля кадра, в пикселях. Считается по
   коробкам детей, а не по scrollHeight: слайд центрирован по вертикали, и
   лишнее уходит вверх и вниз сразу, а scrollHeight видит только низ. */
function overflow(slide) {
  var box = slide.getBoundingClientRect();
  var style = getComputedStyle(slide);
  var top = Infinity;
  var bottom = -Infinity;
  [].forEach.call(slide.children, function (node) {
    var rect = node.getBoundingClientRect();
    if (!rect.height) return;
    top = Math.min(top, rect.top);
    bottom = Math.max(bottom, rect.bottom);
  });
  if (top === Infinity) return 0;
  return Math.max(0, box.top + parseFloat(style.paddingTop) - top)
    + Math.max(0, bottom - (box.bottom - parseFloat(style.paddingBottom)));
}

/* Текст слайда уезжает в свою колонку, картинка встаёт рядом. Перестановка,
   а не вторая ветка рендера: вид слайда собирает одно и то же дерево, а как
   оно стоит в кадре — дело плеера. Порядок текста сохраняется, поэтому в
   разборе условие по-прежнему идёт перед шагами. */
function splitOff(slide) {
  var figure = slide.querySelector(":scope > figure");
  if (!figure) return false;
  var prose = document.createElement("div");
  prose.className = "prose";
  while (slide.firstChild) {
    var node = slide.firstChild;
    slide.removeChild(node);
    if (node !== figure) prose.appendChild(node);
  }
  slide.appendChild(prose);
  slide.appendChild(figure);
  slide.classList.add("split");
  return true;
}

/* Картинка не жертва: пол --visual-min держит CSS, а если с этим полом текст
   и картинка в столбик не помещаются, слайд уходит в две колонки — и только
   потом на ступень вниз по шкале. Раньше было наоборот: текст не двигался, а
   картинка молча схлопывалась до нечитаемой.

   Решение принимается один раз, при первом показе, и не пересматривается:
   всё на слайде задано в долях высоты кадра, а кадр держит 16:9, поэтому
   окно меняет масштаб целиком и переносов строк не трогает — замер,
   сделанный в маленьком окне, верен и на доске. */
function fit(slide) {
  if (slide.dataset.fitted) return;
  slide.dataset.fitted = "1";
  if (overflow(slide) <= 1) return;
  if (splitOff(slide) && overflow(slide) <= 1) return;
  slide.dataset.dense = "1";
  if (overflow(slide) > 1) {
    console.warn("Слайд не помещается в кадр: " + slide.className);
  }
}

/* Прогоны обратно в простой текст — для мест, где нужна строка, а не DOM:
   название этапа в списке и в углу экрана. */
function plain(runs) {
  return (runs || []).map(function (run) {
    return run.math !== undefined ? run.math : (run.t || "");
  }).join("");
}

document.addEventListener("DOMContentLoaded", function () {
  var data = JSON.parse(document.getElementById("presentation-data").textContent);
  if (data.title) document.title = data.title;

  var stage = document.getElementById("stage");
  var counter = document.getElementById("counter");
  var stageLabel = document.getElementById("stage-label");
  var panel = document.getElementById("stages");
  var slides = (data.slides || []).map(buildSlide);
  if (!slides.length) slides = [buildSlide({ type: "title", text: [{ t: data.title || "Пустая презентация" }] })];
  slides.forEach(function (slide) { stage.appendChild(slide); });

  /* Этапы урока — метки section в плоском списке слайдов. Навигация по ним
     строится здесь, потому что этап в данных не контейнер, а слайд. */
  var stages = [];
  (data.slides || []).forEach(function (slide, index) {
    if (slide.type === "section") stages.push({ index: index, name: plain(slide.text) });
  });

  var current = 0;
  var revealed = 0;

  function fragments() {
    return slides[current].querySelectorAll(".fragment");
  }

  function paint() {
    [].forEach.call(fragments(), function (node, i) {
      node.classList.toggle("shown", i < revealed);
    });
    var pending = fragments().length - revealed;
    counter.textContent = (current + 1) + " / " + slides.length + (pending ? " +" + pending : "");
    stageLabel.textContent = stageAt(current);
    [].forEach.call(panel.querySelectorAll("button"), function (button, i) {
      button.classList.toggle("here", stages[i].name === stageAt(current));
    });
  }

  function stageAt(index) {
    var name = "";
    stages.forEach(function (item) { if (item.index <= index) name = item.name; });
    return name;
  }

  /* Шаги при возврате на слайд остаются открытыми, а ответ — нет: он
     закрывается всегда, и показать его снова — отдельное решение учителя,
     а не побочный эффект того, что он вернулся посмотреть условие. */
  function closeAnswers() {
    [].forEach.call(stage.querySelectorAll(".answer.open"), function (node) {
      node.classList.remove("open");
      node.setAttribute("aria-expanded", "false");
      node.setAttribute("aria-label", "Показать ответ");
      node.title = "Нажмите, чтобы показать ответ";
    });
  }

  function show(index, reveal) {
    closeAnswers();
    current = Math.max(0, Math.min(slides.length - 1, index));
    var total = slides[current].querySelectorAll(".fragment").length;
    revealed = reveal === "all" ? total : 0;
    slides.forEach(function (slide, i) { slide.classList.toggle("active", i === current); });
    /* Мерить можно только показанный слайд: спрятанный не разложен. */
    fit(slides[current]);
    paint();
  }

  /* Шаг вперёд открывает следующий спрятанный кусок и только потом уходит на
     следующий слайд; шаг назад закрывает последний открытый. Возврат на
     предыдущий слайд показывает его целиком: класс уже всё это видел, и
     проскочивший учитель платит одно нажатие, а не пять. */
  function next() {
    if (revealed < fragments().length) { revealed += 1; paint(); }
    else if (current < slides.length - 1) show(current + 1, 0);
  }

  function prev() {
    if (revealed > 0) { revealed -= 1; paint(); }
    else if (current > 0) show(current - 1, "all");
  }

  stages.forEach(function (item) {
    var button = document.createElement("button");
    button.type = "button";
    button.textContent = item.name;
    button.addEventListener("click", function () { toggleStages(false); show(item.index, 0); });
    panel.appendChild(button);
  });
  if (stages.length) {
    var caption = document.createElement("div");
    caption.className = "caption";
    caption.textContent = "Этапы урока — Esc, чтобы закрыть";
    panel.insertBefore(caption, panel.firstChild);
  }

  function toggleStages(open) {
    if (!stages.length) return;
    panel.classList.toggle("open", open === undefined ? !panel.classList.contains("open") : open);
  }

  /* Полный экран — дело браузера, а не кадра: кадр 16:9 и так держит свои
     пропорции, экрану он отдаёт только поля вокруг себя. F11 у браузера
     остаётся, кнопка и F — для тех, кто про неё не помнит. */
  var full = document.getElementById("full");
  function toggleFullscreen() {
    var root = document.documentElement;
    if (document.fullscreenElement) {
      if (document.exitFullscreen) document.exitFullscreen();
    } else if (root.requestFullscreen) {
      /* Отказ (нет разрешения, нет жеста) — не повод падать: учитель нажмёт F11. */
      var started = root.requestFullscreen();
      if (started && started.catch) started.catch(function () {});
    }
  }
  document.addEventListener("fullscreenchange", function () {
    var on = !!document.fullscreenElement;
    full.innerHTML = on ? "&#10529;" : "&#10530;";
    full.title = on ? "Выйти из полного экрана (F)" : "Во весь экран (F)";
    full.setAttribute("aria-label", full.title);
  });

  /* Кнопка, нажатая мышью, остаётся в фокусе — и следующий пробел прилетел бы
     ей, а не показу. */
  function press(button, action) {
    button.addEventListener("click", function () { action(); button.blur(); });
  }
  press(document.getElementById("prev"), prev);
  press(document.getElementById("next"), next);
  press(full, toggleFullscreen);
  document.addEventListener("keydown", function (event) {
    if (event.code === "KeyF") {
      event.preventDefault();
      toggleFullscreen();
      return;
    }
    if (event.key === "Escape") {
      event.preventDefault();
      toggleStages();
      return;
    }
    if (panel.classList.contains("open")) return;
    if (event.key === "ArrowRight" || event.key === "PageDown" || event.key === " ") {
      event.preventDefault();
      next();
    } else if (event.key === "ArrowLeft" || event.key === "PageUp") {
      event.preventDefault();
      prev();
    } else if (event.key === "Home") {
      show(0, 0);
    } else if (event.key === "End") {
      show(slides.length - 1, "all");
    }
  });

  show(0, 0);
});
</script>
</body>
</html>
