<!doctype html>
<!--
  Плеер презентации. Рендерит слайды из JSON-блоба ниже — и только из него:
  содержательной разметки в этом файле нет и быть не должно, сборка делает
  ровно одну замену — вставляет блоб в блок presentation-data. Тот же плеер
  позже уедет на сервер; данные этого не заметят — см. docs/presentation.md.
-->
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Презентация</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    font-family: "PT Sans", "Segoe UI", sans-serif;
    color: #1a1a1a;
    background: #ffffff;
    overflow: hidden;
  }
  .slide {
    position: absolute;
    inset: 0;
    display: none;
    flex-direction: column;
    justify-content: center;
    padding: 6vmin 8vmin;
    gap: 3vmin;
  }
  .slide.active { display: flex; }

  .slide-title { align-items: center; text-align: center; }
  .slide-title h1 { font-size: 7vmin; font-weight: 700; }
  .slide-title .subtitle { font-size: 3vmin; color: #555; }

  .slide h2 { font-size: 4.5vmin; font-weight: 700; }
  .slide p { font-size: 3.2vmin; line-height: 1.5; }
  .slide ul { font-size: 3.2vmin; line-height: 1.6; padding-left: 1.2em; }
  .slide li { margin: 0.4em 0; }

  .slide-board_task p.condition { font-size: 3.8vmin; }

  /* Картинка на слайде — не иллюстрация внутри текста, а сам предмет
     разговора: она забирает всё свободное место, а не остаётся того
     размера, в котором её печатают на листе. */
  figure {
    display: flex;
    flex: 1;
    justify-content: center;
    align-items: center;
    min-height: 0;
  }
  /* Вписывает рисунок сам viewBox (xMidYMid meet) — svg остаётся коробкой
     во всё отведённое место, пропорции держит холст, а не CSS. */
  figure svg { width: 100%; height: 100%; }

  .placeholder { color: #999; font-size: 3vmin; align-items: center; }

  .blank {
    text-decoration: underline;
    text-underline-offset: 0.2em;
    white-space: pre;
  }

  #hud {
    position: fixed;
    right: 2vmin;
    bottom: 2vmin;
    display: flex;
    align-items: center;
    gap: 1.2vmin;
    font-size: 2.2vmin;
    color: #999;
    user-select: none;
  }
  #hud button {
    font: inherit;
    color: inherit;
    background: none;
    border: 1px solid #ddd;
    border-radius: 0.5em;
    padding: 0.1em 0.7em;
    cursor: pointer;
  }
  #hud button:hover { color: #1a1a1a; border-color: #999; }
</style>
</head>
<body>
<script type="application/json" id="presentation-data">__PRESENTATION_DATA__</script>
<main id="stage"></main>
<footer id="hud">
  <button id="prev" type="button" aria-label="Предыдущий слайд">&#8249;</button>
  <span id="counter"></span>
  <button id="next" type="button" aria-label="Следующий слайд">&#8250;</button>
</footer>
<script>
"use strict";

/* Runs -> DOM. The wire form is declared in physics_svg/inline.py; the
   player maps it and never parses author text itself. */
function runsInto(target, runs) {
  (runs || []).forEach(function (run) {
    if (run.math !== undefined) {
      var span = document.createElement("span");
      if (window.katex) {
        katex.render(run.math, span, { throwOnError: false, displayMode: !!run.display });
      } else {
        /* Без сети формула остаётся исходным текстом — та же защита, что в документе. */
        span.textContent = (run.display ? "$$" : "$") + run.math + (run.display ? "$$" : "$");
      }
      target.appendChild(span);
    } else if (run.blank !== undefined) {
      var blank = document.createElement("span");
      blank.className = "blank";
      blank.textContent = " ".repeat(run.blank);
      target.appendChild(blank);
    } else if (run.script) {
      var script = document.createElement(run.script);
      script.textContent = run.t;
      target.appendChild(script);
    } else {
      target.appendChild(document.createTextNode(run.t));
    }
  });
}

function el(tag, className, runs) {
  var node = document.createElement(tag);
  if (className) node.className = className;
  if (runs) runsInto(node, runs);
  return node;
}

function figureFor(visual) {
  var figure = document.createElement("figure");
  figure.innerHTML = visual.svg; /* generated by our renderer, escaped at the source */
  return figure;
}

function itemsList(items) {
  var list = document.createElement("ul");
  (items || []).forEach(function (item) {
    var li = document.createElement("li");
    runsInto(li, item);
    list.appendChild(li);
  });
  return list;
}

var RENDERERS = {
  title: function (slide, root) {
    root.appendChild(el("h1", "", slide.text));
    if (slide.subtitle) root.appendChild(el("div", "subtitle", slide.subtitle));
  },
  objectives: function (slide, root) {
    root.appendChild(el("h2", "", [{ t: "Цели урока" }]));
    root.appendChild(itemsList(slide.items));
  },
  content: function (slide, root) {
    if (slide.heading) root.appendChild(el("h2", "", slide.heading));
    if (slide.text) root.appendChild(el("p", "", slide.text));
    if (slide.items) root.appendChild(itemsList(slide.items));
    if (slide.visual) root.appendChild(figureFor(slide.visual));
  },
  board_task: function (slide, root) {
    /* slide.answer приходит в данных, но скелет его не показывает:
       раскрытие ответа — интерактив следующей фазы. */
    root.appendChild(el("p", "condition", slide.text));
    if (slide.visual) root.appendChild(figureFor(slide.visual));
  }
};

function buildSlide(slide) {
  var root = document.createElement("section");
  var render = RENDERERS[slide.type];
  if (render) {
    root.className = "slide slide-" + slide.type;
    render(slide, root);
  } else {
    /* Старый плеер обязан пережить новый тип слайда — заглушкой, не падением. */
    root.className = "slide placeholder";
    root.appendChild(el("p", "", [{ t: "Слайд типа «" + slide.type + "» этот плеер ещё не умеет" }]));
  }
  return root;
}

document.addEventListener("DOMContentLoaded", function () {
  var data = JSON.parse(document.getElementById("presentation-data").textContent);
  if (data.title) document.title = data.title;

  var stage = document.getElementById("stage");
  var counter = document.getElementById("counter");
  var slides = (data.slides || []).map(buildSlide);
  if (!slides.length) slides = [buildSlide({ type: "title", text: [{ t: data.title || "Пустая презентация" }] })];
  slides.forEach(function (slide) { stage.appendChild(slide); });

  var current = 0;
  function show(index) {
    current = Math.max(0, Math.min(slides.length - 1, index));
    slides.forEach(function (slide, i) { slide.classList.toggle("active", i === current); });
    counter.textContent = (current + 1) + " / " + slides.length;
  }

  document.getElementById("prev").addEventListener("click", function () { show(current - 1); });
  document.getElementById("next").addEventListener("click", function () { show(current + 1); });
  document.addEventListener("keydown", function (event) {
    if (event.key === "ArrowRight" || event.key === "PageDown" || event.key === " ") {
      event.preventDefault();
      show(current + 1);
    } else if (event.key === "ArrowLeft" || event.key === "PageUp") {
      event.preventDefault();
      show(current - 1);
    } else if (event.key === "Home") {
      show(0);
    } else if (event.key === "End") {
      show(slides.length - 1);
    }
  });

  show(0);
});
</script>
</body>
</html>
