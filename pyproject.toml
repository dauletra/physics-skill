[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "physics-svg"
# Номер версии живёт в одном месте — src/physics_svg/__init__.py, откуда его
# берут и бандл (VERSION), и проверка тега при выпуске. Дублировать здесь
# значит однажды выпустить архив, чей номер расходится с тегом.
dynamic = ["version"]
description = "Библиотека SVG-иллюстраций по физике и конструктор учебных документов"
requires-python = ">=3.10"
# Зависимостей нет и не должно появиться: скилл работает офлайн, без pip и
# без сети. Проверяется тестом, который сверяет импорты собранного бандла со
# списком стандартной библиотеки (docs/architecture.md).
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "mypy>=1.10",
    "ruff>=0.5",
    # Независимая проверка: сгенерированной JSON Schema валидируются те же
    # фикстуры, что и нашим ядром (см. schema/jsonschema.py).
    "jsonschema>=4",
    # То же самое для .docx: собранный пакет открывается чужой библиотекой.
    # Word на непонравившийся пакет не говорит ничего, поэтому второй
    # читатель — единственное, что похоже на него в CI. В бандл не входит:
    # сам пакет пишется stdlib (docs/word-export.md).
    "python-docx>=1",
]
# Сайт документации (zensical). Отдельной группой намеренно: генератор сайта
# не должен просачиваться ни в зависимости пакета, ни в dev-набор тестов.
docs = [
    "zensical>=0.0.51",
]

[project.scripts]
physics-svg = "physics_svg.cli:main"

[tool.setuptools]
# Пакет живёт в src/ и никак не связан с раскладкой бандла: бандл — артефакт
# сборки (tools/build_skill.py), а не подкаталог репозитория.
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
# Пакет ничего не импортирует на верхнем уровне, поэтому setuptools читает
# __version__ разбором файла, а не импортом.
version = { attr = "physics_svg.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
files = ["src/physics_svg", "tools"]
mypy_path = "src:tools"
explicit_package_bases = true
# Пакет работает на 3.10 (это проверяет матрица в CI), но проверяется типами
# на 3.11: там есть typing.dataclass_transform, без которого проверяющий не
# видит сгенерированный __init__ у spec-классов.
python_version = "3.11"
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

# lxml не поставляет типов, а ставить их ради одного инструмента вне пакета
# незачем: схемной валидацией занимается tools/ooxml_lint.py, и только он.
[[tool.mypy.overrides]]
module = "lxml.*"
ignore_missing_imports = true

[tool.ruff]
target-version = "py310"
# Для isort. Папки тестов перечислены потому, что pytest кладёт папку теста
# в sys.path, и фикстурный модуль оттуда импортируется по имени.
src = ["src", "tools", "tests", "tests/schema", "tests/visuals", "tests/document"]
line-length = 100

[tool.ruff.lint]
# Базовые pyflakes/pycodestyle + сортировка импортов.
select = ["E4", "E7", "E9", "F", "I"]
