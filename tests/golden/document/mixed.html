<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Смешанный документ</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
<script>
document.addEventListener("DOMContentLoaded", function () {
    if (window.renderMathInElement) {
        renderMathInElement(document.body, {
            delimiters: [
                {left: "$$", right: "$$", display: true},
                {left: "$", right: "$", display: false}
            ]
        });
    }
});
</script>
<style>:root { --font-main: "PT Sans", "Segoe UI", Verdana, Arial, sans-serif; }
* { box-sizing: border-box; }
html { background: #fff; }
body {
    font-family: var(--font-main);
    font-size: 12pt;
    line-height: 1.4;
    color: #000;
    background: #fff;
    max-width: 800px;
    margin: 0 auto;
    padding: 24px 32px;
}
/* A ruled space inside a line of text: the author types underscores, the
   renderer prints a line to write on. `vertical-align` keeps the rule on the
   text's own baseline — an empty inline-block would otherwise sit on its own. */
.blank {
    display: inline-block; border-bottom: 1px solid #000;
    margin: 0 4px; vertical-align: baseline;
}
/* Two heading levels and no more: the name of the sheet and the name of a
   section. Inside a task there are no headings at all — the hierarchy there is
   drawn by the task number and the subtask letters. */
.doc-heading { font-weight: bold; }
.doc-heading.level-1 { font-size: 16pt; margin: 0 0 11px 0; }
.doc-heading.level-2 { font-size: 13.5pt; margin: 20px 0 8px 0; }
.doc-divider { border: none; border-top: 1.5px solid #000; margin: 15px 0 23px 0; }
/* The number stands beside the task, not on top of its first block: a task is
   a rectangle in the margin's gutter, and its wording, picture and ruling are
   equally "task 3". The gutter is as wide as the number itself — a sheet with
   `1.` and one with `16.` should not both pay for the longer one.
   flex-start rather than baseline: the first block can be a picture, and its
   baseline is deep inside the drawing — the number would sink with it. */
.task, .task-part { display: flex; align-items: flex-start; gap: 8px; }
.task { margin: 0 0 26px 0; }
.task-num { font-weight: bold; font-size: 12pt; flex: 0 0 auto; }
.subtask-label { font-weight: bold; font-size: 12pt; flex: 0 0 auto; }
/* The stack of blocks the number stands beside — `min-width` lets a wide table
   or picture shrink instead of pushing the gutter off the page. */
.task-blocks { flex: 1 1 auto; min-width: 0; }
.answer-line {
    display: inline-block; min-width: 150px; border-bottom: 1px solid #000; margin-left: 8px;
}
.bank-list { margin-top: 8px; font-size: 11pt; }
/* Without this hint `single` and `multiple` are indistinguishable to a
   student: both render as the same list of options. */
.choice-hint { font-style: italic; font-size: 10.5pt; margin-top: 8px; }
/* The same equal-columns grid as .task-row — one CSS language for "beside". */
.match-columns {
    display: grid; grid-auto-flow: column; grid-auto-columns: 1fr;
    gap: 45px; align-items: start; margin-top: 8px;
}
/* One list markup for options, statements, ranked items and plain bullets. */
.list-component { margin-top: 8px; }
.list-row { display: flex; align-items: baseline; gap: 8px; padding: 5px 8px; }
.list-marker { font-weight: bold; flex: 0 0 auto; }
.list-content { flex: 1 1 auto; min-width: 0; }
/* Two columns are the same grid as a wrapped `row`, not `column-count`: the
   items fill the left column first either way, but multi-column decides where
   the fold falls by balancing height, and the grid is told the row count
   outright — so item 4 is the last one on the left whatever it wraps to. */
.list-component.cols-two {
    display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; column-gap: 30px;
}
.list-component.cols-inline { display: block; }
.list-component.cols-inline .list-row { display: inline-block; margin-right: 23px; }
/* "Statement on the left, control on the right" inside a list row — shared
   by true_false, rank and classify. */
.tf-line { display: flex; align-items: center; justify-content: space-between; width: 100%; gap: 15px; }
.tf-statement { flex: 1; }
.tf-box { display: inline-flex; align-items: center; gap: 6px; font-size: 10pt; white-space: nowrap; }
.tf-square, .rank-square {
    display: inline-block; width: 17px; height: 17px; border: 1.3px solid #000;
    text-align: center; line-height: 16px; font-weight: bold; font-size: 9pt;
}
.rank-square { flex: 0 0 auto; }
.table-component { border-collapse: collapse; width: 100%; margin-top: 8px; }
.table-component th, .table-component td {
    border: 1px solid #000; padding: 6px 9px; text-align: center; font-size: 11pt;
}
.table-component th { background: #eee; }
.fill-blank {
    display: inline-block; min-width: 68px; border-bottom: 1px solid #000;
    margin: 0 4px; text-align: center;
}
/* Answers section: separated by a rule, one item per question — the task
   number (and subtask letter) on the left, the answer on the right.
   flex-start rather than baseline: a plotted answer's first baseline is deep
   inside the picture, and the number would slide down with it. */
.answers-section { margin-top: 34px; border-top: 1.5px solid #000; padding-top: 15px; }
.answers-title { font-size: 13.5pt; font-weight: bold; margin-bottom: 8px; }
.answers-item { display: flex; align-items: flex-start; gap: 8px; margin-bottom: 5px; font-size: 11pt; }
.answers-num { font-weight: bold; flex: 0 0 auto; }
.answers-body { flex: 1 1 auto; min-width: 0; }
/* An answer with one line per element — ranked items, groups. Tighter than a
   list in a task body: this is a column of short lines, not a question. */
.answers-rows > div { margin-bottom: 2px; }
.answers-rows > div:last-child { margin-bottom: 0; }
.answers-explanation { font-style: italic; color: #333; }
/* Blocks of a task stack down the column; the only way to put blocks side by
   side is the `row` container. The gap between them is this margin and nothing
   else: a paragraph keeps the browser's own `1em` otherwise, and the first line
   of the block would then start below the number standing beside it. */
.task-block { margin-bottom: 11px; }
.task-block:last-child { margin-bottom: 0; }
.task-block p { margin: 0; }
/* Illustrations carry their own width and height in pixels — the frame is
   known exactly — so the page only has to keep them inside a narrow column.
   A stretched ruling is the exception: it has no intrinsic ratio, and its
   height attribute is the author's data, so `height: auto` must not touch it. */
svg.visual-svg { display: block; max-width: 100%; }
svg.visual-svg:not(.visual-fluid) { height: auto; }
/* A subtask is indented from the task's shared statement. */
.task-part { margin: 11px 0 11px 23px; }
/* Layout container `row`: children share the line equally. An equal-columns
   grid accounts for the gap itself — no inline width arithmetic from Python. */
.task-row {
    display: grid; grid-auto-flow: column; grid-auto-columns: 1fr;
    gap: 23px; align-items: start; margin-bottom: 8px;
}
/* An explicit column count: the children wrap instead of each claiming a
   column of its own. The flow is already by column, so all a wrapped row needs
   is the exact number of rows — it arrives as an inline style, because only the
   content knows it. A wrapped row is dense on purpose, so the vertical step
   between its items is the document's usual step between blocks, not the wide
   gap that separates columns. */
.task-row.cols-2, .task-row.cols-3, .task-row.cols-4 { row-gap: 8px; }
.task-row:last-child { margin-bottom: 0; }
.task-col { min-width: 0; }
.task-col .task-part { margin-left: 0; }</style>
</head>
<body>
<div class="doc-heading level-2">Теория</div><div class="task-block"><p>Условие.</p></div><div class="task"><span class="task-num">1.</span><div class="task-blocks"><div class="task-block"><p>Условие.</p></div><div class="task-block"><div>Ответ: <span class="answer-line" style="min-width:150px;"></span></div></div></div></div><div class="task-row"><div class="task-col"><div class="task-block"><p>Условие.</p></div></div><div class="task-col"><div class="task-block"><div class="list-component cols-single"><div class="list-row"><span class="list-content">раз</span></div><div class="list-row"><span class="list-content">два</span></div></div></div></div></div><div class="task"><span class="task-num">2.</span><div class="task-blocks"><div class="task-block"><p>Условие.</p></div><div class="task-part"><span class="subtask-label">а)</span><div class="task-blocks"><div class="task-block"><p>а</p></div></div></div><div class="task-part"><span class="subtask-label">б)</span><div class="task-blocks"><div class="task-block"><p>б</p></div><div class="task-block"><svg class="visual-svg visual-fluid" xmlns="http://www.w3.org/2000/svg" viewBox="-0.5 -0.5 491 37" font-family="PT Sans, Segoe UI, Verdana, Arial, sans-serif" width="100%" height="55.5" preserveAspectRatio="none"><line x1="0" y1="18" x2="490" y2="18" fill="none" stroke="#000" stroke-width="1" stroke-dasharray="1,3" vector-effect="non-scaling-stroke"/><line x1="0" y1="36" x2="490" y2="36" fill="none" stroke="#000" stroke-width="1" stroke-dasharray="1,3" vector-effect="non-scaling-stroke"/></svg></div></div></div></div></div><div class="answers-section"><div class="answers-title">Ответы</div><div class="answers-item"><span class="answers-num">1.</span><div class="answers-body">42</div></div><div class="answers-item"><span class="answers-num">2. а)</span><div class="answers-body">42</div></div><div class="answers-item"><span class="answers-num">2. б)</span><div class="answers-body">42</div></div></div>
</body>
</html>
