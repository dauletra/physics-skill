<!doctype html>
<!--
  Плеер презентации. Рендерит слайды из JSON-блоба ниже — и только из него:
  содержательной разметки в этом файле нет и быть не должно, сборка делает
  ровно одну замену — вставляет блоб в блок presentation-data. Тот же плеер
  позже уедет на сервер; данные этого не заметят — см. docs/presentation.md.
-->
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Презентация</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    font-family: "PT Sans", "Segoe UI", sans-serif;
    color: #1a1a1a;
    background: #e8ecf1;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* Кадр 16:9 — то же поле, что у проектора. Слайд живёт внутри него и
     никогда не растекается по окну: размер кадра берёт то из двух
     ограничений, которое наступает раньше, а пропорции держит aspect-ratio.
     Всё внутри задано в cqh — процентах высоты кадра, — поэтому слайд не
     пересчитывает себя под окно, а масштабируется целиком и одинаково. */
  #stage {
    --pad: 2.5vmin;
    position: relative;
    width: min(calc(100vw - 2 * var(--pad)), calc((100vh - 2 * var(--pad)) * 16 / 9));
    aspect-ratio: 16 / 9;
    container-type: size;
    overflow: hidden;
    background: #ffffff;
    border: 1px solid rgba(20, 30, 50, 0.10);
    border-radius: 1vmin;
    box-shadow: 0 0.4vmin 2.4vmin rgba(20, 30, 50, 0.18);
  }

  /* Во весь экран кадр остаётся тем же кадром: уходят поля и рамка, а поле
     вокруг проекции чернеет — так его и не видно на стене. */
  :fullscreen, :fullscreen body { background: #000000; }
  :fullscreen #stage {
    --pad: 0px;
    border: none;
    border-radius: 0;
    box-shadow: none;
  }

  .slide {
    position: absolute;
    inset: 0;
    display: none;
    flex-direction: column;
    justify-content: center;
    padding: 6cqh 8cqh;
    gap: 3cqh;
    /* Кадр — граница: слайд, которому не хватило места, обрезается, а не
       раздвигает рамку и не мельчает сам. */
    overflow: hidden;
  }
  .slide.active { display: flex; }

  .slide-title { align-items: center; text-align: center; }
  .slide-title h1 { font-size: 7cqh; font-weight: 700; }
  .slide-title .subtitle { font-size: 3cqh; color: #555; }

  .slide h2 { font-size: 4.5cqh; font-weight: 700; }
  .slide p { font-size: 3.2cqh; line-height: 1.5; }
  .slide ul, .slide ol { font-size: 3.2cqh; line-height: 1.6; padding-left: 1.2em; }
  .slide li { margin: 0.4em 0; }

  .slide-board_task p.condition, .slide-example p.condition { font-size: 3.8cqh; }

  /* Разделитель этапа — единственный слайд, который выглядит иначе: он не
     содержание, а знак препинания между частями урока. */
  .slide-section { background: #1a1a1a; color: #ffffff; align-items: center; }
  .slide-section h2 { font-size: 6cqh; text-align: center; }

  /* Шаг разбора и ответ ждут своей очереди. Место под них занято сразу:
     слайд не должен прыгать в тот момент, когда класс на него смотрит. */
  .fragment { opacity: 0; transition: opacity 0.15s ease-out; }
  .fragment.shown { opacity: 1; }

  /* Ответ — спойлер: плашка накрывает готовый текст, щелчок по ней его
     показывает, следующий щелчок прячет обратно. Стрелки сюда не ходят —
     ответ не `.fragment`, и открыть его можно только намеренно. */
  .answer {
    /* Текст ответа и плашка лежат в одной ячейке грида, поэтому коробка
       получает ширину большего из двух: плашка ровно по ответу, а не во всю
       строку, и слайд не прыгает, когда ответ открыли. */
    display: inline-grid;
    align-self: flex-start;
    max-width: 100%;
    /* Поле плашки уходит наружу: открытый ответ стоит в одну линию с
       остальным текстом слайда, а не с отступом. */
    margin-left: -0.5em;
    font: inherit;
    font-size: 3.6cqh;
    font-weight: 700;
    text-align: left;
    color: inherit;
    background: none;
    border: none;
    padding: 0;
    cursor: pointer;
  }
  .answer .body, .answer .cover { grid-area: 1 / 1; padding: 0.15em 0.5em; }
  .answer .label { font-weight: 400; color: #777; }
  /* Спрятан от глаз, но не из потока: место под ответ занимает сам ответ. */
  .answer .body { visibility: hidden; }
  .answer.open .body { visibility: visible; }
  .answer .cover {
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 400;
    color: #6b7280;
    background: #f1f4f8;
    border: 1px dashed #b4bdca;
    border-radius: 0.35em;
    transition: opacity 0.15s ease-out;
  }
  .answer.open .cover { opacity: 0; visibility: hidden; }
  /* Наведение только подсвечивает: показывает ответ щелчок, а не мышь,
     проехавшая мимо. */
  .answer:hover .cover { color: #1a1a1a; background: #e9edf3; border-color: #8a95a5; }
  .answer:focus-visible { outline: none; }
  .answer:focus-visible .cover { border-style: solid; border-color: #6b7280; }

  /* Картинка на слайде — не иллюстрация внутри текста, а сам предмет
     разговора: она забирает всё свободное место, а не остаётся того
     размера, в котором её печатают на листе. */
  figure {
    display: flex;
    flex: 1;
    justify-content: center;
    align-items: center;
    min-height: 0;
  }
  /* Вписывает рисунок сам viewBox (xMidYMid meet) — svg остаётся коробкой
     во всё отведённое место, пропорции держит холст, а не CSS. */
  figure svg { width: 100%; height: 100%; }

  .placeholder { color: #999; font-size: 3cqh; align-items: center; }

  .blank {
    text-decoration: underline;
    text-underline-offset: 0.2em;
    white-space: pre;
  }

  /* Пульт живёт внутри кадра — вместе с ним уезжает в полный экран и вместе
     с ним масштабируется, а не висит в углу окна сам по себе. */
  #hud {
    position: absolute;
    z-index: 2;
    right: 2cqh;
    bottom: 2cqh;
    display: flex;
    align-items: center;
    gap: 1.2cqh;
    font-size: 2.2cqh;
    color: #999;
    user-select: none;
  }
  #hud button {
    font: inherit;
    color: inherit;
    background: none;
    border: 1px solid #ddd;
    border-radius: 0.5em;
    padding: 0.1em 0.7em;
    cursor: pointer;
  }
  #hud button:hover { color: #1a1a1a; border-color: #999; }
  #stage-label { max-width: 30cqh; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* Список этапов: учителю нужно уметь вернуться к разбору, а не пролистать
     до него. Этапы — слайды section, навигацию по ним строит плеер. */
  #stages {
    position: absolute;
    z-index: 3;
    inset: 0;
    background: #ffffff;
    display: none;
    flex-direction: column;
    justify-content: center;
    gap: 0.5cqh;
    padding: 6cqh 8cqh;
    overflow-y: auto;
  }
  #stages.open { display: flex; }
  #stages .caption { font-size: 2.6cqh; color: #999; margin-bottom: 1.5cqh; }
  #stages button {
    font: inherit;
    font-size: 4cqh;
    text-align: left;
    color: #1a1a1a;
    background: none;
    border: none;
    padding: 0.25em 0;
    cursor: pointer;
  }
  #stages button:hover { text-decoration: underline; }
  #stages button.here::after { content: " ←"; color: #999; }
</style>
</head>
<body>
<script type="application/json" id="presentation-data">__PRESENTATION_DATA__</script>
<main id="stage">
  <div id="stages"></div>
  <footer id="hud">
    <span id="stage-label"></span>
    <button id="full" type="button" aria-label="Во весь экран" title="Во весь экран (F)">&#10530;</button>
    <button id="prev" type="button" aria-label="Предыдущий слайд">&#8249;</button>
    <span id="counter"></span>
    <button id="next" type="button" aria-label="Следующий слайд">&#8250;</button>
  </footer>
</main>
<script>
"use strict";

/* Runs -> DOM. The wire form is declared in physics_svg/inline.py; the
   player maps it and never parses author text itself. */
function runsInto(target, runs) {
  (runs || []).forEach(function (run) {
    if (run.math !== undefined) {
      var span = document.createElement("span");
      if (window.katex) {
        katex.render(run.math, span, { throwOnError: false, displayMode: !!run.display });
      } else {
        /* Без сети формула остаётся исходным текстом — та же защита, что в документе. */
        span.textContent = (run.display ? "$$" : "$") + run.math + (run.display ? "$$" : "$");
      }
      target.appendChild(span);
    } else if (run.blank !== undefined) {
      var blank = document.createElement("span");
      blank.className = "blank";
      blank.textContent = " ".repeat(run.blank);
      target.appendChild(blank);
    } else if (run.script) {
      var script = document.createElement(run.script);
      script.textContent = run.t;
      target.appendChild(script);
    } else {
      target.appendChild(document.createTextNode(run.t));
    }
  });
}

function el(tag, className, runs) {
  var node = document.createElement(tag);
  if (className) node.className = className;
  if (runs) runsInto(node, runs);
  return node;
}

function figureFor(visual) {
  var figure = document.createElement("figure");
  figure.innerHTML = visual.svg; /* generated by our renderer, escaped at the source */
  return figure;
}

function itemsList(items) {
  var list = document.createElement("ul");
  (items || []).forEach(function (item) {
    var li = document.createElement("li");
    runsInto(li, item);
    list.appendChild(li);
  });
  return list;
}

/* Ответ приходит в данных всегда, а показывается спойлером: когда его
   открыть — решение плеера, а не поле слайда (docs/presentation.md §3).

   Спойлер, а не шаг навигации: шаг разбора учитель проходит вместе с
   классом, а ответ показывает намеренно — и промахнуться стрелкой мимо
   этого решения нельзя. Поэтому ответ не `.fragment`: стрелки и пробел его
   не открывают, счётчик его не обещает, открывает только щелчок по плашке.

   Текст ответа стоит на месте всегда и лишь спрятан от глаз, плашка лежит
   в той же ячейке грида — так место занято настоящим ответом, плашка не
   шире его, и слайд не прыгает ни когда ответ открыли, ни когда закрыли
   обратно. Подсказку «нажмите» несёт подпись кнопки, а не сама плашка:
   лишнее слово на ней задало бы ширину вместо ответа. */
function answerBlock(answer) {
  var node = document.createElement("button");
  node.type = "button";
  node.className = "answer spoiler";
  node.setAttribute("aria-expanded", "false");

  var body = el("span", "body");
  var label = document.createElement("span");
  label.className = "label";
  label.textContent = "Ответ: ";
  body.appendChild(label);
  runsInto(body, answer);
  node.appendChild(body);

  var cover = document.createElement("span");
  cover.className = "cover";
  cover.textContent = "Ответ";
  node.appendChild(cover);

  node.setAttribute("aria-label", "Показать ответ");
  node.title = "Нажмите, чтобы показать ответ";
  node.addEventListener("click", function () {
    var open = node.classList.toggle("open");
    node.setAttribute("aria-expanded", open ? "true" : "false");
    node.setAttribute("aria-label", open ? "Скрыть ответ" : "Показать ответ");
    node.title = open ? "Нажмите, чтобы скрыть ответ" : "Нажмите, чтобы показать ответ";
    /* Кнопка, нажатая мышью, остаётся в фокусе — и следующий пробел ушёл бы
       ей, а не показу. */
    node.blur();
  });
  return node;
}

var RENDERERS = {
  title: function (slide, root) {
    root.appendChild(el("h1", "", slide.text));
    if (slide.subtitle) root.appendChild(el("div", "subtitle", slide.subtitle));
  },
  objectives: function (slide, root) {
    root.appendChild(el("h2", "", [{ t: "Цели урока" }]));
    root.appendChild(itemsList(slide.items));
  },
  section: function (slide, root) {
    root.appendChild(el("h2", "", slide.text));
  },
  content: function (slide, root) {
    if (slide.heading) root.appendChild(el("h2", "", slide.heading));
    if (slide.text) root.appendChild(el("p", "", slide.text));
    if (slide.items) root.appendChild(itemsList(slide.items));
    if (slide.visual) root.appendChild(figureFor(slide.visual));
  },
  example: function (slide, root) {
    root.appendChild(el("p", "condition", slide.text));
    if (slide.visual) root.appendChild(figureFor(slide.visual));
    var steps = document.createElement("ol");
    (slide.steps || []).forEach(function (step) {
      var item = el("li", "fragment", step);
      steps.appendChild(item);
    });
    root.appendChild(steps);
    if (slide.answer) root.appendChild(answerBlock(slide.answer));
  },
  board_task: function (slide, root) {
    root.appendChild(el("p", "condition", slide.text));
    if (slide.visual) root.appendChild(figureFor(slide.visual));
    if (slide.answer) root.appendChild(answerBlock(slide.answer));
  },
  prompt: function (slide, root) {
    root.appendChild(el("h2", "", [{ t: "Вопросы классу" }]));
    root.appendChild(itemsList(slide.items));
  },
  reflection: function (slide, root) {
    root.appendChild(el("h2", "", [{ t: "Рефлексия" }]));
    root.appendChild(itemsList(slide.items));
  }
};

function buildSlide(slide) {
  var root = document.createElement("section");
  var render = RENDERERS[slide.type];
  if (render) {
    root.className = "slide slide-" + slide.type;
    render(slide, root);
  } else {
    /* Старый плеер обязан пережить новый тип слайда — заглушкой, не падением. */
    root.className = "slide placeholder";
    root.appendChild(el("p", "", [{ t: "Слайд типа «" + slide.type + "» этот плеер ещё не умеет" }]));
  }
  return root;
}

/* Прогоны обратно в простой текст — для мест, где нужна строка, а не DOM:
   название этапа в списке и в углу экрана. */
function plain(runs) {
  return (runs || []).map(function (run) {
    return run.math !== undefined ? run.math : (run.t || "");
  }).join("");
}

document.addEventListener("DOMContentLoaded", function () {
  var data = JSON.parse(document.getElementById("presentation-data").textContent);
  if (data.title) document.title = data.title;

  var stage = document.getElementById("stage");
  var counter = document.getElementById("counter");
  var stageLabel = document.getElementById("stage-label");
  var panel = document.getElementById("stages");
  var slides = (data.slides || []).map(buildSlide);
  if (!slides.length) slides = [buildSlide({ type: "title", text: [{ t: data.title || "Пустая презентация" }] })];
  slides.forEach(function (slide) { stage.appendChild(slide); });

  /* Этапы урока — метки section в плоском списке слайдов. Навигация по ним
     строится здесь, потому что этап в данных не контейнер, а слайд. */
  var stages = [];
  (data.slides || []).forEach(function (slide, index) {
    if (slide.type === "section") stages.push({ index: index, name: plain(slide.text) });
  });

  var current = 0;
  var revealed = 0;

  function fragments() {
    return slides[current].querySelectorAll(".fragment");
  }

  function paint() {
    [].forEach.call(fragments(), function (node, i) {
      node.classList.toggle("shown", i < revealed);
    });
    var pending = fragments().length - revealed;
    counter.textContent = (current + 1) + " / " + slides.length + (pending ? " +" + pending : "");
    stageLabel.textContent = stageAt(current);
    [].forEach.call(panel.querySelectorAll("button"), function (button, i) {
      button.classList.toggle("here", stages[i].name === stageAt(current));
    });
  }

  function stageAt(index) {
    var name = "";
    stages.forEach(function (item) { if (item.index <= index) name = item.name; });
    return name;
  }

  /* Шаги при возврате на слайд остаются открытыми, а ответ — нет: он
     закрывается всегда, и показать его снова — отдельное решение учителя,
     а не побочный эффект того, что он вернулся посмотреть условие. */
  function closeAnswers() {
    [].forEach.call(stage.querySelectorAll(".answer.open"), function (node) {
      node.classList.remove("open");
      node.setAttribute("aria-expanded", "false");
      node.setAttribute("aria-label", "Показать ответ");
      node.title = "Нажмите, чтобы показать ответ";
    });
  }

  function show(index, reveal) {
    closeAnswers();
    current = Math.max(0, Math.min(slides.length - 1, index));
    var total = slides[current].querySelectorAll(".fragment").length;
    revealed = reveal === "all" ? total : 0;
    slides.forEach(function (slide, i) { slide.classList.toggle("active", i === current); });
    paint();
  }

  /* Шаг вперёд открывает следующий спрятанный кусок и только потом уходит на
     следующий слайд; шаг назад закрывает последний открытый. Возврат на
     предыдущий слайд показывает его целиком: класс уже всё это видел, и
     проскочивший учитель платит одно нажатие, а не пять. */
  function next() {
    if (revealed < fragments().length) { revealed += 1; paint(); }
    else if (current < slides.length - 1) show(current + 1, 0);
  }

  function prev() {
    if (revealed > 0) { revealed -= 1; paint(); }
    else if (current > 0) show(current - 1, "all");
  }

  stages.forEach(function (item) {
    var button = document.createElement("button");
    button.type = "button";
    button.textContent = item.name;
    button.addEventListener("click", function () { toggleStages(false); show(item.index, 0); });
    panel.appendChild(button);
  });
  if (stages.length) {
    var caption = document.createElement("div");
    caption.className = "caption";
    caption.textContent = "Этапы урока — Esc, чтобы закрыть";
    panel.insertBefore(caption, panel.firstChild);
  }

  function toggleStages(open) {
    if (!stages.length) return;
    panel.classList.toggle("open", open === undefined ? !panel.classList.contains("open") : open);
  }

  /* Полный экран — дело браузера, а не кадра: кадр 16:9 и так держит свои
     пропорции, экрану он отдаёт только поля вокруг себя. F11 у браузера
     остаётся, кнопка и F — для тех, кто про неё не помнит. */
  var full = document.getElementById("full");
  function toggleFullscreen() {
    var root = document.documentElement;
    if (document.fullscreenElement) {
      if (document.exitFullscreen) document.exitFullscreen();
    } else if (root.requestFullscreen) {
      /* Отказ (нет разрешения, нет жеста) — не повод падать: учитель нажмёт F11. */
      var started = root.requestFullscreen();
      if (started && started.catch) started.catch(function () {});
    }
  }
  document.addEventListener("fullscreenchange", function () {
    var on = !!document.fullscreenElement;
    full.innerHTML = on ? "&#10529;" : "&#10530;";
    full.title = on ? "Выйти из полного экрана (F)" : "Во весь экран (F)";
    full.setAttribute("aria-label", full.title);
  });

  /* Кнопка, нажатая мышью, остаётся в фокусе — и следующий пробел прилетел бы
     ей, а не показу. */
  function press(button, action) {
    button.addEventListener("click", function () { action(); button.blur(); });
  }
  press(document.getElementById("prev"), prev);
  press(document.getElementById("next"), next);
  press(full, toggleFullscreen);
  document.addEventListener("keydown", function (event) {
    if (event.code === "KeyF") {
      event.preventDefault();
      toggleFullscreen();
      return;
    }
    if (event.key === "Escape") {
      event.preventDefault();
      toggleStages();
      return;
    }
    if (panel.classList.contains("open")) return;
    if (event.key === "ArrowRight" || event.key === "PageDown" || event.key === " ") {
      event.preventDefault();
      next();
    } else if (event.key === "ArrowLeft" || event.key === "PageUp") {
      event.preventDefault();
      prev();
    } else if (event.key === "Home") {
      show(0, 0);
    } else if (event.key === "End") {
      show(slides.length - 1, "all");
    }
  });

  show(0, 0);
});
</script>
</body>
</html>
