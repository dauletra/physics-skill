[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "physics-svg"
version = "0.2.0.dev0"
description = "Библиотека SVG-иллюстраций по физике и конструктор учебных документов"
requires-python = ">=3.10"
# Пакет `physics_svg` зависимостей не имеет и не должен их заводить: скилл
# работает офлайн, без pip и без сети (docs/architecture.md). pydantic здесь
# только ради старого пакета worksheet_builder, который остаётся эталоном
# невырождения до конца Ф3 и уезжает вместе с ним.
dependencies = [
    "pydantic>=2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "mypy>=1.10",
    "ruff>=0.5",
    # Независимая проверка: сгенерированной JSON Schema валидируются те же
    # фикстуры, что и нашим ядром (см. schema/jsonschema.py).
    "jsonschema>=4",
]
# Сайт документации (zensical). Отдельной группой намеренно: контракт
# запуска скилла — «в sandbox нужен только pydantic», и генератор сайта не
# должен просачиваться ни в зависимости пакета, ни в dev-набор тестов.
docs = [
    "zensical>=0.0.51",
]

[project.scripts]
render-worksheet = "worksheet_builder.cli:main"

[tool.setuptools]
# Новый пакет живёт в src/ и никак не связан с раскладкой бандла: бандл —
# артефакт сборки (tools/build_skill.py), а не подкаталог репозитория.
# worksheet_builder — старый пакет, лежит внутри папки-бандла и уедет
# вместе с ней после Ф3.
package-dir = { "physics_svg" = "src/physics_svg", "worksheet_builder" = "worksheet-builder/worksheet_builder" }
packages = [
    "physics_svg",
    "physics_svg.draw",
    "physics_svg.schema",
    "worksheet_builder",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
files = ["src/physics_svg", "worksheet-builder/worksheet_builder"]
mypy_path = "src:worksheet-builder"
explicit_package_bases = true
python_version = "3.10"
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[tool.ruff]
target-version = "py310"
# Для isort: новый пакет в src/, старый — в worksheet-builder/, conftest — в
# tests/; tests/schema — потому что pytest кладёт папку теста в sys.path, и
# фикстурный модуль оттуда импортируется по имени.
src = ["src", "worksheet-builder", "tests", "tests/schema"]
line-length = 100

[tool.ruff.lint]
# Базовые pyflakes/pycodestyle + сортировка импортов.
select = ["E4", "E7", "E9", "F", "I"]
