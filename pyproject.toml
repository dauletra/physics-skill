[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "worksheet-builder"
version = "0.1.0"
description = "Детерминированный рендерер рабочих листов: JSON-черновик -> читаемый HTML"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "mypy>=1.10",
    "ruff>=0.5",
]
# Сайт документации (zensical). Отдельной группой намеренно: контракт
# запуска скилла — «в sandbox нужен только pydantic», и генератор сайта не
# должен просачиваться ни в зависимости пакета, ни в dev-набор тестов.
docs = [
    "zensical>=0.0.51",
]

[project.scripts]
render-worksheet = "worksheet_builder.cli:main"

[tool.setuptools]
# Пакет живёт внутри папки скилла: worksheet-builder/ = ровно состав бандла,
# вся dev-обвязка (этот файл, tests/, docs/) — в корне репо.
package-dir = {"" = "worksheet-builder"}
packages = [
    "worksheet_builder",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
files = ["worksheet-builder/worksheet_builder"]
mypy_path = "worksheet-builder"
explicit_package_bases = true
python_version = "3.10"
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[tool.ruff]
target-version = "py310"
# Для isort: пакет лежит в worksheet-builder/, conftest — в tests/.
src = ["worksheet-builder", "tests"]

[tool.ruff.lint]
# Базовые pyflakes/pycodestyle + сортировка импортов.
select = ["E4", "E7", "E9", "F", "I"]
